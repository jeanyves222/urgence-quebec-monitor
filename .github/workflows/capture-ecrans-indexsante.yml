name: Capture écrans Index Santé (quarts)

# Déclenché UNIQUEMENT par un appel externe (cron-job.org) toutes les 5
# minutes via workflow_dispatch. La très grande majorité de ces
# déclenchements se terminent en quelques secondes sans rien capturer :
# c'est le script Python qui décide, à la minute près (heure de Montréal),
# s'il doit réellement capturer.
#
# Anti-doublon (V1.1) : une vraie capture dure plusieurs minutes — plus
# longtemps que l'intervalle de 5 minutes entre deux appels. Il arrive donc
# que deux exécutions démarrent avant que la première ait fini et poussé ses
# fichiers, chacune capturant la même fenêtre sans le savoir. Pour éviter
# que ça se termine en run "failed" (conflit git sur des fichiers binaires),
# l'étape de commit revérifie juste avant d'ajouter les fichiers si le
# dossier de cette capture existe déjà sur origin/main, et s'arrête
# proprement (succès, rien à faire) si c'est le cas — aucune donnée n'est
# perdue, l'autre exécution a déjà poussé une capture équivalente.
on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Forcer une capture complète maintenant (test), même hors fenêtre de quart"
        type: boolean
        default: false

concurrency:
  group: capture-ecrans-indexsante
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances Python
        run: pip install playwright pillow

      - name: Installer Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Lancer la capture (no-op si hors fenêtre, sauf si forcée)
        env:
          FORCER_CAPTURE: ${{ github.event.inputs.forcer || 'false' }}
        run: python scripts/capture_ecrans_indexsante.py

      - name: Committer et pousser les nouvelles captures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Anti-doublon git : si le script a rempli un dossier de capture,
          # son chemin nous a été transmis via DOSSIER_CAPTURE. On revérifie
          # ici, à la toute dernière minute, si ce dossier existe déjà sur
          # origin/main — auquel cas une autre exécution nous a devancés
          # pendant qu'on capturait, et on s'arrête sans rien committer.
          if [ -n "$DOSSIER_CAPTURE" ]; then
            git fetch origin main --quiet
            if git cat-file -e "origin/main:$DOSSIER_CAPTURE" 2>/dev/null; then
              echo "Une autre exécution a déjà capturé et poussé '$DOSSIER_CAPTURE' entre-temps — doublon ignoré, aucune donnée perdue."
              exit 0
            fi
          fi

          if [ -d captures ]; then
            git add captures/
          fi

          if git diff --cached --quiet; then
            echo "Rien à committer (hors fenêtre, fenêtre déjà captée, ou capture échouée sans aucun fichier)."
            exit 0
          fi

          git commit -m "Capture écrans Index Santé $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Boucle de reprise avec rebase, filet de sécurité pour le cas rare
          # où une autre exécution aurait poussé entre notre vérification
          # ci-dessus et notre propre push. Si malgré tout un vrai conflit de
          # fusion survient (même cause : doublon de fenêtre), on abandonne
          # proprement plutôt que de faire échouer le run — l'autre
          # exécution a déjà les captures.
          for tentative in 1 2 3; do
            if git push; then
              echo "Poussé avec succès (tentative $tentative)."
              exit 0
            fi
            echo "Échec du push (tentative $tentative), rebase et nouvel essai..."
            if ! git pull --rebase; then
              echo "Conflit de fusion pendant le rebase — probablement un doublon de fenêtre déjà poussé par une autre exécution. Abandon propre, aucune donnée perdue."
              git rebase --abort
              exit 0
            fi
            sleep 5
          done

          echo "ÉCHEC : impossible de pousser après 3 tentatives."
          exit 1
