name: Capture écrans Index Santé (quarts)

# Déclenché UNIQUEMENT par un appel externe (cron-job.org) toutes les 5
# minutes via workflow_dispatch. L'ancien déclencheur natif GitHub
# (« schedule: ») a été retiré volontairement : en plus d'être peu fiable
# (déclenchements rares et imprévisibles), le garder actif EN MÊME TEMPS
# que cron-job.org causait des déclenchements en double pour une même
# fenêtre de quart (deux exécutions parallèles capturant les mêmes pages
# et entrant en conflit au moment de pousser les fichiers). Avec un seul
# déclencheur (cron-job.org), ce risque disparaît.
#
# La très grande majorité de ces déclenchements se terminent en quelques
# secondes sans rien capturer : c'est le script Python qui décide, à la
# minute près (heure de Montréal), s'il doit réellement capturer.
on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Forcer une capture complète maintenant (test), même hors fenêtre de quart"
        type: boolean
        default: false

concurrency:
  group: capture-ecrans-indexsante
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances Python
        run: pip install playwright pillow

      - name: Installer Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Lancer la capture (no-op si hors fenêtre, sauf si forcée)
        env:
          FORCER_CAPTURE: ${{ github.event.inputs.forcer || 'false' }}
        run: python scripts/capture_ecrans_indexsante.py

      - name: Committer et pousser les nouvelles captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d captures ]; then
            git add captures/
          fi

          if git diff --cached --quiet; then
            echo "Rien à committer (hors fenêtre, ou fenêtre déjà captée)."
            exit 0
          fi

          git commit -m "Capture écrans Index Santé $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Boucle de reprise avec rebase, au cas où un autre passage aurait
          # poussé entre-temps — trois tentatives, comme sur les autres
          # workflows du dépôt.
          for tentative in 1 2 3; do
            if git push; then
              echo "Poussé avec succès (tentative $tentative)."
              exit 0
            fi
            echo "Échec du push (tentative $tentative), rebase et nouvel essai..."
            git pull --rebase
            sleep 5
          done

          echo "ÉCHEC : impossible de pousser après 3 tentatives."
          exit 1
