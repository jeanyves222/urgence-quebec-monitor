name: Test d'accès à Index Santé

# Déclenchement manuel uniquement — aucun cron, aucune incidence sur la capture.
# À supprimer une fois la question tranchée.
on:
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Page nationale des urgences
        run: |
          set +e
          URL="https://www.indexsante.ca/urgences/"
          echo "=== $URL ==="
          CODE=$(curl -s -o page.html -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
            -H "Accept-Language: fr-CA,fr;q=0.9" \
            --max-time 60 "$URL")
          echo "Code HTTP        : $CODE"
          echo "Taille reçue     : $(wc -c < page.html) octets"
          echo "Taille compressée: $(gzip -c page.html | wc -c) octets"
          echo "--- Marqueurs attendus ---"
          echo "Bloc national trouvé : $(grep -c "Situation dans l'ensemble des urgences" page.html)"
          echo "Bandeau de mise à jour :"
          grep -o "Derni[^<]*mise [^<]*jour[^<]*" page.html | head -2
          echo "--- 300 premiers caractères ---"
          head -c 300 page.html
          echo ""

      - name: Fiche individuelle (Notre-Dame-de-Fatima)
        run: |
          set +e
          URL="https://www.indexsante.ca/hopitaux/bas-saint-laurent/11839/hopital-notre-dame-de-fatima.php"
          echo "=== $URL ==="
          CODE=$(curl -s -o fiche.html -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
            -H "Accept-Language: fr-CA,fr;q=0.9" \
            --max-time 60 "$URL")
          echo "Code HTTP        : $CODE"
          echo "Taille reçue     : $(wc -c < fiche.html) octets"
          echo "--- DMS recherchées ---"
          grep -o "salle d'attente[^:]*:[^<]*" fiche.html | head -1
          grep -o "civi[^:]*:[^<]*" fiche.html | head -2
