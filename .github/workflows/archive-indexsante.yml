name: Archive de la page Index Santé
# Distinct du workflow de capture Données Québec : s'il échoue, l'autre
# continue sans s'en apercevoir.
#
# Une seule fois par heure, à la minute 55 (10 min après la publication de
# H:45), décalée de 5 minutes de la capture (50). Quatre passages avaient
# été essayés du 19 au 26 août, puis deux du 31 août au 2 septembre : dans
# les deux cas GitHub a fini par ne plus lancer qu'une fraction des
# exécutions planifiées. Demander moins en obtient davantage.
# Le nommage par l'horodatage déclaré dans la page empêche tout doublon, donc
# un passage qui ne trouve rien de neuf ne coûte rien.
on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:
# MÊME groupe que le workflow de capture : les deux poussent dans le dépôt, et
# deux poussées simultanées se marcheraient dessus. Ils s'attendent l'un l'autre.
concurrency:
  group: capture-urgences
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  archiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-capture.txt
      - name: Archiver la page
        id: archive
        run: python3 scripts/archiver_indexsante.py
      - name: Committer et pousser si du neuf
        if: steps.archive.outputs.ecritures == '1'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexsante/
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Archive Index Santé — $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentative in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push refusé (tentative $tentative) — rebase et nouvel essai."
            git pull --rebase --autostash
            sleep 5
          done
          echo "::error::Push impossible après trois tentatives."
          exit 1
