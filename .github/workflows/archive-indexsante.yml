name: Archive de la page Index Santé
# Distinct du workflow de capture Données Québec : s'il échoue, l'autre
# continue sans s'en apercevoir.
#
# Déclenchement EXTERNE uniquement (cron-job.org appelle l'API workflow_dispatch
# à la minute 55 de chaque heure, 5 minutes après capture.yml) depuis le
# 6 septembre 2026. Le cron GitHub interne a été retiré après l'incident du
# 6 septembre : les deux déclencheurs (interne et externe) ont capté la même
# publication source à quelques secondes d'écart, produit deux commits pour
# le même nom de fichier, et provoqué un conflit de fusion Git (add/add) que
# la boucle de reprise ne peut pas résoudre automatiquement — le portrait de
# 16h45 a été perdu ce jour-là. Un seul chemin de déclenchement élimine ce
# risque de collision.
#
# Historique de cadence : 4 passages/heure du 19 au 26 août, puis 2/heure
# jusqu'au 2 septembre — dans les deux cas GitHub a fini par ne lancer qu'une
# fraction des exécutions planifiées. Demander moins en obtient davantage.
# Le nommage par l'horodatage déclaré dans la page empêche tout doublon, donc
# un passage qui ne trouve rien de neuf ne coûte rien.
on:
  workflow_dispatch:        # déclenché par cron-job.org (minute 55) ou manuellement depuis l'onglet Actions
# MÊME groupe que le workflow de capture : les deux poussent dans le dépôt, et
# deux poussées simultanées se marcheraient dessus. Ils s'attendent l'un l'autre.
concurrency:
  group: capture-urgences
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  archiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-capture.txt
      - name: Archiver la page
        id: archive
        run: python3 scripts/archiver_indexsante.py
      - name: Committer et pousser si du neuf
        if: steps.archive.outputs.ecritures == '1'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexsante/
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Archive Index Santé — $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentative in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push refusé (tentative $tentative) — rebase et nouvel essai."
            git pull --rebase --autostash
            sleep 5
          done
          echo "::error::Push impossible après trois tentatives."
          exit 1
